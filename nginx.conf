nginx {
  # Disable default config
  default_server {
    listen 8080 default_server;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Static files for Vite output
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
      access_log off;
      default_type text/plain;
      return 200 "OK\n";
    }
  }
}
